<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Swarfly</title>
<style>
  html, body { margin: 0; height: 100%; background: #1d2530; color: #dfe6ee; font-family: Segoe UI, Arial, sans-serif; overflow: hidden; user-select: none; }
  .box { height: 100%; box-sizing: border-box; padding: 26px 30px; display: flex; flex-direction: column; border: 1px solid #3a4656; }
  .head { display: flex; align-items: center; gap: 18px; }
  .head img { width: 72px; height: 72px; }
  h1 { font-size: 22px; margin: 0; font-weight: 600; }
  h2 { font-size: 13px; margin: 4px 0 0; font-weight: 400; color: #8fa1b6; }
  .spin { margin-left: auto; width: 30px; height: 30px; border: 4px solid #3a4656; border-top-color: #4fb3ff; border-radius: 50%; animation: r 0.9s linear infinite; }
  @keyframes r { to { transform: rotate(360deg); } }
  .log { margin-top: 22px; flex: 1; font: 12px Consolas, monospace; color: #9fb0c3; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; }
  .log div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: .55; }
  .log div:last-child { opacity: 1; color: #e8f1fb; }
  .bar { height: 3px; background: #2b3645; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 35%; background: #4fb3ff; animation: s 1.4s ease-in-out infinite; }
  @keyframes s { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
</style>
</head>
<body>
<div class="box">
  <div class="head">
    <img src="splash-logo.png" alt="">
    <div><h1>Swarfly</h1><h2>G-code for milling and laser</h2></div>
    <div class="spin"></div>
  </div>
  <div class="log" id="log"></div>
  <div class="bar"><i></i></div>
</div>
<script>
  var lines = [];
  function setStatus(text) {
    lines.push(text);
    if (lines.length > 6) lines.shift();
    var log = document.getElementById('log');
    log.innerHTML = '';
    lines.forEach(function (l) { var d = document.createElement('div'); d.textContent = l; log.appendChild(d); });
  }
  setStatus('Starting...');
</script>
</body>
</html>
